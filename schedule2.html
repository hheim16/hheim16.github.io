<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hans Heim | Schedule</title>

<style>

body {
    background-color: #000000;
    color: #00ff33;
    font-family: 'Courier New', Courier, monospace;
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 20px;
    line-height: 1.6;
}

h1 {
    color: #33ff66;
    text-shadow: 0 0 5px #00ff33;
    border-bottom: 1px solid #00ff33;
    padding-bottom: 5px;
}

a {
    color: #00ff33;
    text-decoration: none;
    border: 1px solid #00ff33;
    padding: 4px 10px;
    display: inline-block;
    margin: 5px 0;
}

a:hover {
    background-color: #00ff33;
    color: #000000;
    box-shadow: 0 0 10px #00ff33;
}

/* Schedule */

.schedule-wrapper {
    margin-top: 30px;
    overflow-x: auto;
}

.schedule {
    display: grid;
    grid-template-columns: 80px repeat(5, 1fr);
    min-width: 900px;
    border: 1px solid #00ff33;
}

.time-header,
.day-header {
    padding: 10px;
    text-align: center;
    border: 1px solid #00ff33;
    font-weight: bold;
    background-color: #001100;
}

.time-column {
    display: flex;
    flex-direction: column;
}

.time {
    height: 60px;
    border: 1px solid #003300;
    padding: 2px 5px;
    font-size: 0.8rem;
}

.day-column {
    position: relative;
    height: 540px;
    border-left: 1px solid #00ff33;
    background:
        repeating-linear-gradient(
            to bottom,
            transparent,
            transparent 59px,
            #003300 60px
        );
}

.course {
    position: absolute;
    left: 5px;
    right: 5px;

    border: 1px solid #00ff33;
    background-color: rgba(0,255,51,0.12);

    box-shadow:
        0 0 8px rgba(0,255,51,0.4);

    padding: 6px;
    text-align: center;
}

.course strong {
    display: block;
}

.course span {
    font-size: 0.85rem;
}

</style>
</head>

<body>

<header>

<h1>[ Teaching Schedule ]</h1>

<p>> Current Semester Timetable</p>

    <a href="schedule.html">> SCHEDULE</a>

</nav>

</header>

<div class="schedule">

    <!-- TIME COLUMN -->

        <div class="time">08:00</div>
        <div class="time">09:00</div>

        <div class="time">11:00</div>
